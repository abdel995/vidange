<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="oilGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="wrenchGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="url(#bgGrad)" stroke="#f59e0b" stroke-width="6" />

  <!-- Center subtle glow ring -->
  <circle cx="256" cy="240" r="140" fill="#1e293b" stroke="#334155" stroke-width="4" opacity="0.6" />

  <!-- Oil Droplet -->
  <path d="M 256 120 C 256 120 180 230 180 280 A 76 76 0 0 0 332 280 C 332 230 256 120 256 120 Z" 
        fill="url(#oilGrad)" filter="url(#glow)" />
  
  <!-- Droplet shine highlight -->
  <ellipse cx="230" cy="270" rx="20" ry="32" transform="rotate(-30 230 270)" fill="#fef3c7" opacity="0.6" />

  <!-- Wrench Bar / Maintenance Tool -->
  <g transform="translate(136, 370)">
    <rect x="0" y="0" width="240" height="36" rx="18" fill="url(#wrenchGrad)" />
    <circle cx="24" cy="18" r="8" fill="#ffffff" />
    <circle cx="216" cy="18" r="8" fill="#ffffff" />
    <!-- Gear cog mark -->
    <circle cx="120" cy="18" r="10" fill="#93c5fd" />
  </g>
</svg>
